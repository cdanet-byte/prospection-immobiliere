<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ImmoProspect, mes mandats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><strong>ImmoProspect</strong><small>Christophe Danet · Efficity</small></div>
    <nav id="nav">
      <button data-tab="today" class="on">Aujourd'hui</button>
      <button data-tab="leads">Prospects</button>
      <button data-tab="pipeline">Pipeline</button>
      <button data-tab="scripts">Scripts</button>
      <button data-tab="data">Données</button>
    </nav>
  </aside>
  <main>
    <header class="band"><h1 id="title">Aujourd'hui</h1><button id="newBtn" class="btn">+ Nouveau prospect</button></header>
    <section id="view"></section>
  </main>
</div>

<dialog id="dlg">
  <form id="form">
    <h2 id="formTitle">Nouveau prospect</h2>
    <div class="grid">
      <label>Prénom<input name="prenom" required></label>
      <label>Nom<input name="nom"></label>
      <label>Téléphone<input name="tel" inputmode="tel"></label>
      <label>Email<input name="email" type="email"></label>
      <label>Source
        <select name="source">
          <option value="pap">PAP</option>
          <option value="lbc">Leboncoin</option>
          <option value="expire">Mandat expiré</option>
          <option value="secteur">Propriétaire du secteur</option>
          <option value="reseau">Réseau</option>
        </select>
      </label>
      <label>Statut<select name="statut" id="statutSel"></select></label>
      <label>Adresse ou rue<input name="rue"></label>
      <label>Commune<input name="commune"></label>
      <label>Type de bien<input name="type" placeholder="maison, appartement..."></label>
      <label>Surface (m²)<input name="surface" type="number" min="0" step="1"></label>
      <label>Prix demandé (€)<input name="prix" type="number" min="0" step="1000"></label>
      <label>Annonce en ligne depuis le<input name="dateAnnonce" type="date"></label>
      <label>Fin du mandat précédent<input name="finMandat" type="date"></label>
      <label>Prochaine relance<input name="nextAction" type="date"></label>
    </div>
    <label class="check"><input type="checkbox" name="urgent"> Vente urgente (mutation, succession, divorce, achat en cours)</label>
    <label>Notes<textarea name="notes" rows="3"></textarea></label>
    <div class="actions">
      <button type="button" class="btn ghost danger" id="delBtn">Supprimer</button>
      <span class="grow"></span>
      <button type="button" class="btn ghost" id="cancelBtn">Annuler</button>
      <button type="submit" class="btn">Enregistrer</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
